name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (e.g. v0.1.0a1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and smoke install
    runs-on: windows-latest
    outputs:
      version: ${{ steps.release-tag.outputs.version }}
      prerelease: ${{ steps.release-tag.outputs.prerelease }}
      commit: ${{ steps.release-tag.outputs.commit }}
      unsigned_artifact_id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install development tools
        run: uv sync --locked
      - name: Validate release tag
        id: release-tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          uv run --no-sync python packaging/build_windows.py check-release-tag --tag "$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Build wheel and sdist
        run: uv build
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          uv run --no-sync python packaging/build_windows.py build --wheel $wheel --dist dist\windows
      - name: Check artifact
        shell: pwsh
        run: uv run --no-sync python packaging/build_windows.py check-artifact --dist dist\windows
      - name: Smoke install
        shell: pwsh
        run: uv run --no-sync python packaging/build_windows.py smoke-install --dist dist\windows
      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist\windows\BelegDock-*-windows-x64-setup.exe release-assets\
          Copy-Item dist\windows\artifact.json release-assets\
          Copy-Item dist\*.whl release-assets\
          Copy-Item dist\*.tar.gz release-assets\
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
      - name: Upload unsigned installer for signing
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: release-assets/BelegDock-*-windows-x64-setup.exe
          if-no-files-found: error

  sign:
    name: Sign installer (SignPath)
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - name: Submit signing request
        id: submit
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.unsigned_artifact_id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify signature
        id: verify
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SIGNER || 'SignPath Foundation' }}
        run: |
          $files = @(Get-ChildItem signed\BelegDock-*-windows-x64-setup.exe)
          if ($files.Count -ne 1) { throw "Expected exactly one signed installer, found $($files.Count)." }
          $signature = Get-AuthenticodeSignature -FilePath $files[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode status is $($signature.Status), not Valid." }
          if (-not $signature.SignerCertificate.Subject.Contains($env:EXPECTED_SIGNER)) { throw "Unexpected signer: $($signature.SignerCertificate.Subject)" }
          if ($null -eq $signature.TimeStamperCertificate) { throw "The signature carries no trusted timestamp." }
          $subject = $signature.SignerCertificate.Subject
          $thumbprint = $signature.SignerCertificate.Thumbprint
          $timestamper = $signature.TimeStamperCertificate.Subject
          $verifiedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $hash = (Get-FileHash -Algorithm SHA256 -Path $files[0].FullName).Hash.ToLowerInvariant()
          Write-Host "Signer:      $subject"
          Write-Host "Thumbprint:  $thumbprint"
          Write-Host "Timestamper: $timestamper"
          Write-Host "Verified at: $verifiedAt"
          Write-Host "SHA-256:     $hash"
          "subject=$subject" >> $env:GITHUB_OUTPUT
          "thumbprint=$thumbprint" >> $env:GITHUB_OUTPUT
          "timestamper=$timestamper" >> $env:GITHUB_OUTPUT
          "verified_at=$verifiedAt" >> $env:GITHUB_OUTPUT
          "file=$($files[0].FullName)" >> $env:GITHUB_OUTPUT
      - name: Rebuild release assets with the signed installer
        shell: pwsh
        env:
          EXPECTED_SIGNER: ${{ vars.SIGNPATH_EXPECTED_SIGNER || 'SignPath Foundation' }}
          SIGNED_FILE: ${{ steps.verify.outputs.file }}
          SIGNER_SUBJECT: ${{ steps.verify.outputs.subject }}
          SIGNER_THUMBPRINT: ${{ steps.verify.outputs.thumbprint }}
          SIGNER_TIMESTAMPER: ${{ steps.verify.outputs.timestamper }}
          SIGNER_VERIFIED_AT: ${{ steps.verify.outputs.verified_at }}
        run: |
          python packaging/build_windows.py apply-signature --assets release-assets --signed "$env:SIGNED_FILE" --expected-signer "$env:EXPECTED_SIGNER" --subject "$env:SIGNER_SUBJECT" --thumbprint "$env:SIGNER_THUMBPRINT" --timestamper "$env:SIGNER_TIMESTAMPER" --verified-at "$env:SIGNER_VERIFIED_AT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload signed release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-signed
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, sign]
    if: ${{ !cancelled() && !failure() && needs.build.result == 'success' && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && vars.SIGNPATH_ORGANIZATION_ID == '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.sign.result == 'success' && 'release-assets-signed' || 'release-assets' }}
          path: release-assets
      - name: Generate checksums
        run: python3 packaging/build_windows.py write-checksums --output release-assets/SHA256SUMS.txt release-assets/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          tagged="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$tagged" = "$COMMIT" || { echo "Tag $RELEASE_TAG does not point at the built commit $COMMIT." >&2; exit 1; }
          args=(--title "BelegDock $RELEASE_TAG" --generate-notes --verify-tag)
          case "$PRERELEASE" in
            true) args+=(--prerelease) ;;
            false) ;;
            *) echo "Unexpected prerelease value: $PRERELEASE" >&2; exit 1 ;;
          esac
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/*
