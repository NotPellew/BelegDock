name: evidence

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Verify evidence recorder
        run: uv run python -m unittest discover -s tests/evidence -v
      - name: Snapshot protected inputs
        run: uv run python scripts/test_evidence.py snapshot --repo . --output "$RUNNER_TEMP/belegdock-evidence/snapshot.json"
      - name: Record complete application GREEN
        run: uv run python scripts/test_evidence.py run --repo . --snapshot "$RUNNER_TEMP/belegdock-evidence/snapshot.json" --output "$RUNNER_TEMP/belegdock-evidence/green" --phase green
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: ${{ runner.temp }}/belegdock-evidence
          if-no-files-found: error
          retention-days: 90
