[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "belegdock"
version = "0.1.0.dev0"
description = "Local document attachment selection and transfer experiments"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "BelegDock contributors" }]
dependencies = [
    "google-api-python-client>=2.149,<3",
    "google-auth-oauthlib>=1.2,<2",
    "httpx>=0.27,<1",
    "keyring>=25.5,<26",
    "platformdirs>=4.3,<5",
]

[project.scripts]
belegdock = "belegdock.cli:main"

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/app"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
